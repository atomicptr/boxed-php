[www]

; Only nginx inside this container should be able to reach FastCGI.
listen = 127.0.0.1:9000
listen.allowed_clients = 127.0.0.1
listen.backlog = 4096

; We dont need this because nginx already logs each request.
access.log = /dev/null

php_admin_flag[log_errors] = on
catch_workers_output = yes
decorate_workers_output = no

ping.path = /healthz
ping.response = pong

request_terminate_timeout = 120s

pm = dynamic

; restart worker after X requests to prevent memory leaks
pm.max_requests = 500

pm.max_children = 32
pm.min_spare_servers = 4
pm.max_spare_servers = 12
